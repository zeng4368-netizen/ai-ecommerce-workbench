[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecom-ops-agents"
version = "0.2.0"
description = "Local automation agents for cross-border e-commerce operations."
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "fastapi>=0.115",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "playwright>=1.45",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "streamlit>=1.36",
    "uvicorn>=0.30",
    "yt-dlp>=2026.7",
    "imageio-ffmpeg>=0.5",
    "openai>=2.0",
    "scenedetect>=0.6.7",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8.2",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]

[project.scripts]
ecom-ops = "ecom_ops.cli:main"
video-mix = "ecom_ops.video_mixer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["dashi-taskboard", "external", "data", "logs", "reports"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
files = ["src/ecom_ops"]
exclude = "(dashi-taskboard|external|data|logs|reports)"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
